services:
  mtproto-proxy:
    image: telegrammessenger/proxy:latest
    container_name: telegram-mtproto-proxy
    restart: unless-stopped
    environment:
      SECRET: "${PROXY_SECRET:?Set PROXY_SECRET in .env}"
    ports:
      - "8443:443/tcp"
    volumes:
      - mtproto-data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

  landing:
    image: nginx:1.29-alpine
    container_name: telegram-proxy-landing
    restart: unless-stopped
    ports:
      - "8081:80/tcp"
    volumes:
      - ./site:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mtproto-data:
