<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Telegram Proxy</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #17212b; }
      main { max-width: 38rem; padding: 2.5rem; text-align: center; }
      a { display: inline-block; margin-top: 1.25rem; padding: .85rem 1.15rem; border-radius: .6rem; background: #2aabee; color: white; font-weight: 700; text-decoration: none; }
      p { color: #d9e4eb; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Telegram Proxy</h1>
      <p>Откройте эту страницу по ссылке подключения, выданной администратором.</p>
      <a id="connect" hidden>Подключить прокси в Telegram</a>
    </main>
    <script>
      const link = new URLSearchParams(location.search).get("link");
      if (link && link.startsWith("tg://proxy?")) {
        const button = document.querySelector("#connect");
        button.href = link;
        button.hidden = false;
      }
    </script>
  </body>
</html>
